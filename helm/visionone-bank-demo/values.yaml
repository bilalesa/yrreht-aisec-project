replicaCount: 1

image:
  repository: your-registry.example.com/visionone-bank-demo
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

config:
  appName: VisionOne Bank Demo
  appEnv: demo
  publicBaseUrl: ""
  maxUploadMb: 10
  tmv1Region: sg
  tmv1ApplicationName: visionone-bank-demo
  aiGuardEnabled: true
  aiGuardFallback: block
  aiGuardMaskPii: true
  aiGuardTimeoutSeconds: 8
  forceDemoMode: false
  allowRuntimeConfig: true
  llmChatUrl: ""
  llmModel: visionone-bank-demo
  llmTimeoutSeconds: 30
  fileSecurityEnabled: true
  fileSecurityRegion: ap-southeast-1
  fileSecurityPml: true
  fileSecurityDemoFallback: false
  fileStorageS3Bucket: ""
  fileStorageS3Prefix: incoming/
  awsRegion: ap-southeast-1

secrets:
  create: false
  existingSecret: visionone-bank-demo-secrets
  tmv1ApiKey: ""
  fileSecurityApiKey: ""
  llmApiKey: ""
  aiScannerTargetToken: ""

persistence:
  enabled: true
  storageClass: ""
  accessModes: ["ReadWriteOnce"]
  size: 1Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "12m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
  hosts:
    - host: bank-demo.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: bank-demo-tls
      hosts:
        - bank-demo.example.com

networkPolicy:
  enabled: false
  ingressNamespaceSelector: {}
  dnsNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: kube-system
  # Raw Kubernetes NetworkPolicy egress entries. Add rules here for a
  # Optional extra egress rules for a private LLM, proxy, or other internal dependency.
  additionalEgress: []

# Useful for HTTP(S)_PROXY, NO_PROXY, AWS settings, or custom runtime flags.
extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

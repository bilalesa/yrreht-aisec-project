services:
  tfbank:
    image: ${APP_IMAGE:-tfbank-demo:120.0.0}

    restart: unless-stopped

    env_file:
      - ${APP_ENV_FILE:?Set APP_ENV_FILE to an absolute env-file path}

    ports:
      - "${HOST_PORT:-8081}:8080"

    volumes:
      - tfbank-data:/data

    read_only: true

    tmpfs:
      - /tmp:size=160m,mode=1777

    security_opt:
      - no-new-privileges:true

volumes:
  tfbank-data:
    name: ${DATA_VOLUME:-tfbank-demo-data}
